# Drums slots: host inotify limits. Installed to /etc/sysctl.d/60-drums-slots.conf by install_sysctl.sh.
#
# fs.inotify.max_user_instances is one count per user (per user namespace and uid). CRIU creates every restored
# inotify instance as uid 0, so all slots on a host share ONE count: with 8192, a host stops at about 300 GNOME slots
# (about 27 instances each), and a restore past it fails with
#   fsnotify: Can't create inotify fd ...: Too many open files
# Measured on one host (2026-10-30): 527 instances per slot with a 500-instance app, the 15th
# slot failed at 8192; at 131072, 30 slots (16,363 instances, 2x the old cap) came up and 60/60 resets passed.
#
# Raising it does not open a memory hole: an instance costs about 1.0 KiB and a watch about 0.1 KiB, both charged to
# the creating task's memory cgroup (the slot's, for a restore), so each slot's memory.max still bounds them.
# What it does not fix: the count is still shared by every slot (one slot could use it all). The structural fix is
# one user namespace owner per slot (see the report).
fs.inotify.max_user_instances = 131072
fs.inotify.max_user_watches = 4194304
